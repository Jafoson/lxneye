# Gruppiert die automatisch erzeugten Release Notes nach Pull-Request-Labels.
changelog:
  exclude:
    labels: [ignore-for-release]
  categories:
    - title: Neu
      labels: [feature, enhancement]
    - title: Fehlerbehebungen
      labels: [bug, fix]
    - title: Sicherheit
      labels: [security]
    - title: Abhängigkeiten
      labels: [dependencies]
    - title: Sonstiges
      labels: ['*']
